<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{{title}}}</title>
    <style>
      @page {
        size: A4 landscape; /* Set paper size to A4 and orientation to landscape */
        margin: 20mm; /* Set margin for the PDF */
      }
      body {
        font-family: Arial, sans-serif; /* Set a default font */
        margin: 0; /* Remove default margin */
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: auto; /* Use auto layout for better responsiveness */
      }
      th,
      td {
        border: 1px solid black;
        padding: 8px;
        text-align: left;
        overflow: hidden; /* Prevent overflow */
        white-space: nowrap; /* Prevent text wrapping */
        text-overflow: ellipsis; /* Add ellipsis for overflow text */
      }
      h3 {
        page-break-after: avoid; /* Prevent page break after headings */
      }
      @media print {
        body {
          margin: 0; /* Remove margin for print */
        }
        table {
          page-break-inside: auto; /* Allow page breaks inside tables */
        }
      }
    </style>
  </head>
  <body>
    <h2>{{{title}}}</h2>
    <p>Data ini diambil pada tanggal: {{{currentDate}}}</p>

    <h3>Data Kwarran</h3>
    <table>
      <thead>
        <tr>
          <th style="width: 5%">Kode</th>
          <th style="width: 20%">Nama</th>
          <th style="width: 20%">Ketua Kwarran</th>
          <th style="width: 20%">Ketua DKR</th>
          <th style="width: 25%">Email</th>
          <th style="width: 10%">J. Gudep</th>
        </tr>
      </thead>
      <tbody>
        {{{kwarranRows}}}
      </tbody>
    </table>

    <h3>Data Gudep</h3>
    <table>
      <thead>
        <tr>
          <th style="width: 3%">No</th>
          <th style="width: 6%">Kode</th>
          <th style="width: 7%">Gudep</th>
          <th style="width: 11%">Tingkatan</th>
          <th style="width: 15%">Mabigus</th>
          <th style="width: 15%">Pembina</th>
          <th style="width: 15%">Pelatih</th>
          <th style="width: 22%">Email</th>
          <th style="width: 3%">JL</th>
          <th style="width: 3%">JP</th>
        </tr>
      </thead>
      <tbody>
        {{{gudepRows}}}
      </tbody>
    </table>

    <h3>Data Geografis</h3>
    <table>
      <thead>
        <tr>
          <th style="width: 10%">Kode</th>
          <th style="width: 10%">Gudep</th>
          <th style="width: 30%">Koordinat</th>
          <th style="width: 50%">Alamat</th>
        </tr>
      </thead>
      <tbody>
        {{{geografisRows}}}
      </tbody>
    </table>
  </body>
</html>
